<div class="snapshot">
  <div *ngIf="hasError">
    <p class="alert alert-error text-error">
      Error generating Oncology program snapshot
    </p>
  </div>
  <div *ngIf="!hasData && !hasError && hasLoadedData">
    <p class="alert alert-warning">
      No patient data to generate Oncology program snapshot
    </p>
  </div>
  <div *ngIf="!hasError && !hasData && !isIntegratedProgram">
    <div class="snapshot-summary">
      <h4 class="component-title">Last Encounter</h4>
      <div class="col-md-12">
        <div class="full-width" *ngIf="!latestEncounterLocation">
          <p>
            Location:
            <span>{{ location }}</span>
          </p>
        </div>
      </div>
      <div class="snapshot-body">
        <!-- <div *ngIf="summaryData"></div> -->
        <div>
          <div class="col-md-12">
            <div class="col-md-6 col-xs-12">
              <p>Date: 12/06/2025</p>
            </div>
            <div class="col-md-6 col-xs-12">
              <p>
                Test Results:
                <span>Negative</span>
              </p>
            </div>
          </div>
          <div class="col-md-12">
            <div class="col-md-6 col-xs-12">
              <p>
                Date of Last Hiv Test:
                <span>02/05/2025</span>
              </p>
            </div>
            <div class="col-md-6 col-xs-12">
              <p>Type of HIV Test: Rapid antibody</p>
            </div>
            <div class="col-md-6 col-xs-12">
              <p>Result Confirmation Done: +VE</p>
            </div>
          </div>
        </div>
        
        <div class="clear"></div>
      </div>
    </div>
  </div>
  <!-- <div *ngIf="!hasLoadedData && !hasError">
    <p>Loading patient data here....</p>
  </div> -->
</div>
